[project]
name = "brazil-open-data-ingest"
version = "0.1.0"
description = "Idempotent ingestion of Brazilian government open data (Novo CAGED) into partitioned Parquet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Erick Bonruque" }]
keywords = ["caged", "brazil", "open-data", "ftp", "parquet", "duckdb", "etl", "data-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=1.2",
    "py7zr>=0.22",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
brazil-ingest = "brazil_ingest.cli:main"

[project.urls]
Source = "https://github.com/ErickBonruque/brazil-open-data-ingest"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.8",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brazil_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = ["S608"]  # SQL is built from validated identifiers only (see caged/convert.py)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S321"]  # S321: the tests fake the public FTP server

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["py7zr.*", "boto3.*", "botocore.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
