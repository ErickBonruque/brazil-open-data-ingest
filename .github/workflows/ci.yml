name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", resolution: "lowest-direct", extras: "" }
          - { python: "3.12", resolution: "highest", extras: "--all-extras" }
          - { python: "3.13", resolution: "highest", extras: "--all-extras" }
    name: test (py${{ matrix.python }}, ${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv run --isolated --python ${{ matrix.python }}
          --resolution ${{ matrix.resolution }} ${{ matrix.extras }} --group dev
          pytest --cov=brazil_ingest --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/aws-lambda/Dockerfile -t brazil-ingest-lambda .
      - run: >
          docker run --rm --entrypoint python brazil-ingest-lambda
          -c "import brazil_ingest.aws_lambda, boto3, duckdb, py7zr; print('ok')"
